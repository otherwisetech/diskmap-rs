[package]
name = "diskmap-app"
description = "See what fills your disk: a fast, native treemap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "diskmap"
path = "src/main.rs"

[dependencies]
i18n.workspace = true
scan.workspace = true
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
# Move to Trash / Recycle Bin instead of deleting
trash = "5"
async-channel = "2"
# GitHub star count (one GET a day)
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"
otherwise-link.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# free space per mounted volume (already in the tree through gpui)
sysinfo = { version = "0.31", default-features = false, features = ["disk"] }

[dev-dependencies]
tempfile = "3"

# build.rs embeds the .exe icon; only pulled in when building on Windows
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
